name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing (no token needed)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! ls dist/*-"$TAG"-*.whl > /dev/null 2>&1; then
            echo "Release tag ($TAG) does not match the built package version:"
            ls dist
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1